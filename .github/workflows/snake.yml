name: Generate GitHub Snake Animation

on:
  schedule:
    # Berjalan otomatis setiap 12 jam (pukul 00:00 dan 12:00 UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch: # Bisa dijalankan manual kapan saja
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate Snake SVG from GitHub Contribution Graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Axlytic
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff6a00&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff6a00

      - name: Deploy Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

